name: Verify Pipeline
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: kestrel_test
          POSTGRES_USER: kestrel
          POSTGRES_PASSWORD: kestrel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kestrel -d kestrel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KESTREL_TEST_DATABASE_URL: postgresql://kestrel:kestrel_test_password@localhost:5432/kestrel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --disable-warnings
