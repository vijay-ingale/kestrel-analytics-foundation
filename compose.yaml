services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kestrel}
      POSTGRES_USER: ${POSTGRES_USER:-kestrel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kestrel_local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kestrel}:${POSTGRES_PASSWORD:-kestrel_local}@db:5432/${POSTGRES_DB:-kestrel}
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-kestrel}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kestrel_local}
      PGDATABASE: ${POSTGRES_DB:-kestrel}
      PGPORT: "5432"
    volumes:
      - ${KESTREL_DATA_DIR:-../data}:/data:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "pipeline.build", "--data", "/data"]
  ui:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kestrel}:${POSTGRES_PASSWORD:-kestrel_local}@db:5432/${POSTGRES_DB:-kestrel}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
